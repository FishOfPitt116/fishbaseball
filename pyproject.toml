[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fishbaseball"
version = "0.1.0"
description = "Baseball data for Python: Lahman, Retrosheet, and Statcast."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Robbie" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.0",
  "httpx>=0.27",
  "platformdirs>=4.0",
  "filelock>=3.13",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/FishOfPitt116/fishbaseball"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]
markers = ["integration: hits the live published release (tests/integration)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
